<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | AI Security Institutes tracker</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>try { if (localStorage.getItem("aisi-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
  <style>
    /* Standalone recovery page. Use the tracker's palette, a readable measure
       and system fonts so missing paths need no external assets. Theme as on the
       tracker: light by default, dark when the reader chose it there. */
    :root { color-scheme: light; --ground: #FAF7F2; --ink: #1A1A1A; --link: #8F5A23; }
    :root[data-theme="dark"] { color-scheme: dark; --ground: #17191A; --ink: #F3F0EB; --link: #E9AA79; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 1rem/1.5 "Segoe UI", Arial, sans-serif; }
    main { max-width: 42rem; margin: 12vh auto; padding: 1.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; line-height: 1.15; }
    p { margin-block: 1.5rem; }
    a { color: var(--link); text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>AI Security Institutes tracker</p>
    <h1>Page not found</h1>
    <p>The address may have changed or the page may no longer exist.</p>
    <p><a href="/">Return to the tracker</a></p>
  </main>
</body>
</html>

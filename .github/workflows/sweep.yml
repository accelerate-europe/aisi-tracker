# The full page sweep of the release runbook (docs/release.md), on a runner instead of a shared host:
# each view builds the site from the chosen ref, runs scripts/sweep_page.py and uploads its slices and sweep.json as one tar.
# A push to next that changes the data, the page, the scripts or the sweep starts it, so a page fault shows when it
# merges, not first at the release (docs/release.md, step 1). A newer push may replace a sweep still waiting to start,
# so read the sweep of the commit you release from. Elsewhere, start it by hand: gh workflow run sweep.yml --ref <branch>
name: sweep
on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - data/**
      - site/**
      - scripts/**
      - .github/workflows/sweep.yml
      - .github/actions/fonts/**
permissions:
  contents: read
env:
  UV_EXCLUDE_NEWER: "7 days" # as in pages.yml: the window the lockfiles record
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        view: [1440-light, 1440-dark, 1000-light, 1000-dark, 390-light, 390-dark]
    concurrency:
      group: sweep-${{ github.ref }}-${{ matrix.view }}
      cancel-in-progress: false # a later push to the same branch waits instead of cancelling a dispatched release sweep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/*.lock
      # The locked Playwright's Chromium: the browser the build, gate, contact sheet and sweep use on every host.
      - run: uv run --locked -q scripts/check_page.py --install-chrome
      - uses: ./.github/actions/fonts
      - run: uv run --locked scripts/check.py --only build --out dist --report-dir "$RUNNER_TEMP/check"
      - run: uv run --locked scripts/sweep_page.py --dist dist --out "$RUNNER_TEMP/sweep" --views ${{ matrix.view }}
      # As a tar, like the site artifact: one file, unpacked with tar -xf after gh run download. Also when the sweep
      # failed, so its findings can be read; nothing is uploaded when it never started.
      - if: ${{ !cancelled() }}
        run: if [ -d "$RUNNER_TEMP/sweep" ]; then tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/sweep.tar" sweep; fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-${{ matrix.view }}
          path: ${{ runner.temp }}/sweep.tar
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
